name: BlackServ TV debug APK

on:
  push:
    branches: [blackserv/clean-tv-v1, blackserv/tv-v2-integration-20261107, blackserv/tv-v3-performance-20261108]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout with original ZeroTier JNI submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" "ndk;23.1.7779620"
      - name: Verify unit tests and compile TV APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testCandidateUnitTest :app:assembleCandidate --no-daemon --console plain
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blackserv-tv-candidate-apk
          path: app/build/outputs/apk/candidate/app-candidate.apk
          if-no-files-found: error
          retention-days: 14
